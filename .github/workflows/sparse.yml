name: Sparse Tensor checks
on: [push, pull_request]
jobs:
  sparse-autograd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [np, nd]
    defaults:
      run:
        working-directory: prev_hws/hw4
    env:
      PYTHONPATH: python
      NEEDLE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pybind11 pytest
      - if: matrix.backend == 'nd'
        run: make lib
      - run: python -m unittest discover -s tests/sparse -v
